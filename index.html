<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday Babyyyy🎂</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #a18cd1);
      color: white;
    }

    /* BACKGROUND */
    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;
      z-index: -1;
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      animation: float 8s infinite ease-in-out;
    }

    .circle:nth-child(1) {
      width: 250px;
      height: 250px;
      top: -80px;
      left: -80px;
    }

    .circle:nth-child(2) {
      width: 180px;
      height: 180px;
      bottom: 10%;
      right: -50px;
      animation-delay: 2s;
    }

    .circle:nth-child(3) {
      width: 100px;
      height: 100px;
      top: 40%;
      left: 10%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-40px) rotate(180deg);
      }
    }

    /* OPENING */
    #opening {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
    }

    .opening-box {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(15px);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 45px 30px;
      border-radius: 30px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      animation: appear 1.5s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cake {
      font-size: 80px;
      animation: cake 1.5s infinite ease-in-out;
    }

    @keyframes cake {
      0%,100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-12px);
      }
    }

    .opening-box h1 {
      font-size: 42px;
      margin: 15px 0;
    }

    .opening-box p {
      font-size: 16px;
      opacity: .9;
      margin-bottom: 25px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 14px 28px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      color: #ff4f81;
      background: white;
      box-shadow: 0 8px 25px rgba(0,0,0,.2);
      transition: .3s;
    }

    button:hover {
      transform: scale(1.08);
      box-shadow: 0 12px 30px rgba(0,0,0,.3);
    }

    /* MAIN */
    #main {
      display: none;
      min-height: 100vh;
      padding: 60px 20px;
    }

    .container {
      max-width: 850px;
      margin: auto;
      text-align: center;
    }

    .title {
      font-size: clamp(42px, 8vw, 80px);
      font-weight: 800;
      text-shadow: 0 5px 20px rgba(0,0,0,.2);
      animation: titleAnimation 2s ease;
    }

    @keyframes titleAnimation {
      from {
        opacity: 0;
        transform: scale(.5);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .subtitle {
      font-size: 20px;
      margin-top: 10px;
      opacity: .9;
    }

    /* PHOTO */
    .photo {
      width: 190px;
      height: 190px;
      border-radius: 50%;
      margin: 35px auto;
      padding: 7px;
      background: white;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
      overflow: hidden;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    /* MESSAGE */
    .message-box {
      margin: 30px auto;
      background: rgba(255,255,255,.15);
      backdrop-filter: blur(15px);
      padding: 35px;
      border-radius: 25px;
      border: 1px solid rgba(255,255,255,.25);
      box-shadow: 0 20px 50px rgba(0,0,0,.15);
      text-align: left;
      line-height: 1.8;
    }

    .message-box h2 {
      text-align: center;
      margin-bottom: 20px;
      font-size: 28px;
    }

    #typing {
      white-space: pre-line;
      font-size: 16px;
    }

    /* HEARTS */
    .heart {
      position: fixed;
      bottom: -50px;
      font-size: 25px;
      animation: heartUp linear forwards;
      pointer-events: none;
    }

    @keyframes heartUp {
      from {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      to {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    /* CONFETTI */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -20px;
      animation: confettiFall linear forwards;
      pointer-events: none;
    }

    @keyframes confettiFall {
      to {
        transform: translateY(110vh) rotate(720deg);
      }
    }

    /* MUSIC BUTTON */
    .music {
      position: fixed;
      right: 20px;
      bottom: 20px;
      width: 50px;
      height: 50px;
      padding: 0;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      z-index: 20;
    }

    /* FOOTER */
    footer {
      margin-top: 40px;
      opacity: .8;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 600px) {
      .opening-box {
        padding: 35px 20px;
      }

      .opening-box h1 {
        font-size: 32px;
      }

      .cake {
        font-size: 65px;
      }

      .message-box {
        padding: 25px 20px;
      }

      .photo {
        width: 160px;
        height: 160px;
      }
    }
  </style>
</head>

<body>

  <!-- BACKGROUND -->
  <div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <!-- HALAMAN PEMBUKA -->
  <section id="opening">

    <div class="opening-box">

      <div class="cake">🎂</div>

      <h1>Halooo sayangkuuuu 💖</h1>

      <p>
        Ada sesuatu yang spesial nih untuk kamu...
        <br>
        Klik tombol dibawah yaaaaa sayangkuuu 🎁
      </p>

      <button onclick="openBirthday()">
        💌 Buka Ucapan
      </button>

    </div>

  </section>


  <!-- HALAMAN UTAMA -->
  <section id="main">

    <div class="container">

      <div class="title">
        Happy Birthday cintakuuuuu! 🎉
      </div>

      <div class="subtitle">
        Selamat ulang tahun sayanggggg💖
      </div>


      <!-- FOTO -->
      <div class="photo">

        <!-- GANTI URL FOTO DI BAWAH -->
        <img
          src="WhatsApp Image 2026-08-16 at 20.40.08 (1).jpeg"
          alt="Foto"
        >

      </div>


      <!-- UCAPAN -->
      <div class="message-box">

        <h2>💌 Untuk cintaku</h2>

        <div id="typing"></div>

      </div>


      <button onclick="createConfetti()">
        🎉 Rayakan!
      </button>


      <footer>
        Dibuat dengan ❤️ khusus untukmu
      </footer>

    </div>

  </section>


  <!-- MUSIC -->
  <button class="music" id="musicButton" onclick="toggleMusic()">
    🎵
  </button>

  <!--
    GANTI FILE MUSIK DENGAN FILE MP3 MILIKMU.
    Contoh:
    <audio id="music" src="lagu-ulang-tahun.mp3"></audio>
  -->

  <audio id="music"></audio>


  <script>

    /* ==============================
       UCAPAN
    ============================== */

    const message = `
Selamat ulang tahun, sayangku. ❤️🎂

Hari ini bukan hanya tentang bertambahnya usiamu, tapi juga tentang rasa syukurku karena Tuhan telah menghadirkan seseorang sepertimu dalam hidupku.

Terima kasih karena sudah menjadi bagian terindah dari perjalanan hidupku. Terima kasih untuk setiap senyuman, perhatian, kesabaran, dan kasih sayang yang selalu kamu berikan. Mungkin aku tidak selalu bisa menjadi pasangan yang sempurna, tapi percayalah, perasaanku kepadamu selalu tulus.

Di usia barumu ini, aku berharap kamu selalu diberikan kesehatan, kebahagiaan, dan kekuatan untuk melewati setiap hal yang datang. Semoga semua impian yang kamu simpan dalam hati satu per satu menjadi kenyataan alwayss support uu babyyy

Aku ingin terus melihat senyummu, menemani langkahmu, mendengarkan ceritamu, dan berada di sampingmu dalam keadaan apa pun. Semoga bukan hanya hari ini aku bisa mengucapkan selamat ulang tahun kepadamu, tetapi juga di tahun-tahun berikutnya, dengan kita yang masih saling mencintai.

Kalau suatu hari nanti kamu merasa dunia terlalu berat, ingatlah bahwa kamu tidak sendirian. Ada aku yang akan selalu berusaha menjadi tempatmu pulang.

Selamat bertambah usia, cintaku. ❤️

Semoga panjang umur, semoga bahagia selalu, dan semoga kita bisa terus menciptakan banyak cerita indah bersama.

Aku mencintaimu, lebih dari yang mampu aku tuliskan dalam kata-kata.
Happy Birthday, sayangku. 🎂❤️✨

    `;


    /* ==============================
       BUKA WEBSITE
    ============================== */

    function openBirthday() {

      document.getElementById("opening").style.display = "none";

      document.getElementById("main").style.display = "block";

      document.getElementById("musicButton").style.display = "flex";

      createConfetti();

      startTyping();

      createHearts();

    }


    /* ==============================
       EFEK MENGETIK
    ============================== */

    function startTyping() {

      const element = document.getElementById("typing");

      let index = 0;

      function type() {

        if (index < message.length) {

          element.textContent += message.charAt(index);

          index++;

          setTimeout(type, 25);

        }

      }

      type();

    }


    /* ==============================
       CONFETTI
    ============================== */

    function createConfetti() {

      const colors = [
        "#ff4757",
        "#ffa502",
        "#2ed573",
        "#1e90ff",
        "#e84393",
        "#ffffff",
        "#ffd32a"
      ];

      for (let i = 0; i < 120; i++) {

        const confetti = document.createElement("div");

        confetti.classList.add("confetti");

        confetti.style.left =
          Math.random() * 100 + "vw";

        confetti.style.background =
          colors[Math.floor(Math.random() * colors.length)];

        confetti.style.animationDuration =
          (Math.random() * 3 + 2) + "s";

        confetti.style.animationDelay =
          Math.random() * 1.5 + "s";

        confetti.style.width =
          (Math.random() * 8 + 5) + "px";

        confetti.style.height =
          (Math.random() * 8 + 5) + "px";

        document.body.appendChild(confetti);

        setTimeout(() => {
          confetti.remove();
        }, 6000);

      }

    }


    /* ==============================
       HATI TERBANG
    ============================== */

    function createHearts() {

      const hearts = [
        "❤️",
        "💖",
        "💕",
        "💗",
        "💓",
        "💘"
      ];

      setInterval(() => {

        const heart = document.createElement("div");

        heart.classList.add("heart");

        heart.innerHTML =
          hearts[Math.floor(Math.random() * hearts.length)];

        heart.style.left =
          Math.random() * 100 + "vw";

        heart.style.fontSize =
          (Math.random() * 20 + 15) + "px";

        heart.style.animationDuration =
          (Math.random() * 4 + 5) + "s";

        document.body.appendChild(heart);

        setTimeout(() => {
          heart.remove();
        }, 9000);

      }, 700);

    }


    /* ==============================
       MUSIC
    ============================== */

    let playing = false;

    function toggleMusic() {

      const music = document.getElementById("music");
      const button = document.getElementById("musicButton");

      /*
        Kalau ingin memakai musik:

        1. Masukkan file MP3 ke folder yang sama
           dengan index.html.

        2. Ubah:
           
           music.src = "lagu.mp3";
      */

      if (!music.src) {

        alert(
          "Tambahkan file musik terlebih dahulu pada bagian audio di HTML."
        );

        return;

      }

      if (playing) {

        music.pause();

        button.innerHTML = "🎵";

        playing = false;

      } else {

        music.play();

        button.innerHTML = "🔊";

        playing = true;

      }

    }

  </script>

</body>
</html>
